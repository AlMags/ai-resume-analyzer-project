services:

  api:

    build: .

    container_name: ai-resume-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongodb
    
  mongodb:
    
    image: mongo:8

    container_name: ai-resume-mongodb

    ports:
      - "27017:27017"
    
    volumes:
      - mongodb_data:/data/db
    
volumes:

  mongodb_data:

